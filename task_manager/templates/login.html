{% extends "base.html" %}
{% load static %}
{% block title %}Login · Task Manager{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Log in</h1>
  <form id="auth-form" data-mode="login">
    <label>Username <input name="username" required autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <p id="error" class="error"></p>
    <button type="submit" class="btn primary full">Log in</button>
  </form>
  <p class="muted">No account? <a href="/signup/">Sign up</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/auth.js' %}"></script>{% endblock %}
