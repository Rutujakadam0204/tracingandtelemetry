# Tempo in single-binary mode: receives spans, stores them on local disk,
# and answers Grafana's trace queries. Nothing is published to the host.

stream_over_http_enabled: true

server:
  http_listen_port: 3200   # query API that Grafana uses (http://tempo:3200)
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          # Since Tempo 2.7 receivers listen on localhost by default, so the
          # collector container couldn't reach it without this.
          endpoint: 0.0.0.0:4317

ingester:
  # Recent spans are held in memory/WAL and flushed to a block at least every 5m.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h   # delete traces older than 48 hours

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
